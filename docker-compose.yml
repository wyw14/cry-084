services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fire
      POSTGRES_PASSWORD: fire
      POSTGRES_DB: fireops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fire -d fireops"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    environment:
      APP_ADDR: :8080
      DATABASE_URL: postgres://fire:fire@postgres:5432/fireops?sslmode=disable
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata: {}
